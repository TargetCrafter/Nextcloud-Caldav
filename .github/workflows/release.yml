name: Release plasmoid package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to publish as (e.g. v0.2.2)"
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .plasmoid archive
        run: |
          # `|| true`: apt-get update fails its whole exit code if *any*
          # configured source errors, including third-party ones the
          # runner image pre-configures and this workflow never touches
          # (e.g. Google Chrome's repo) - a mirror hiccup there shouldn't
          # block installing zip, which comes from the base Ubuntu archive.
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq zip
          ./package.sh

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: com.vertc.nextcloud.caldav.plasmoid
          generate_release_notes: true
