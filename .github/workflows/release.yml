name: Release plasmoid package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build .plasmoid archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          ./package.sh

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: com.github.targetcrafter.kdecaldav.plasmoid
          generate_release_notes: true
